# Typecheck and test on every push and pull request.
#
# The suites that matter most are the ones that talk to something real — the permission
# boundary against Postgres, the SigV4 signer against an S3-compatible server, the mailer
# against SMTP. Those skip rather than fail when their service is absent, which is right on a
# contributor's laptop and wrong here: CI is the one place that should always have them.
# So CI brings up the services and the suites run.
#
# No lint step. There is no lint tooling in this repo and it cannot be added yet: TypeScript
# 7.0 is the native port and ships a CLI with no compiler API, which typescript-eslint needs.
# Revisit at 7.1 rather than adding a linter that cannot see types.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mimnets
          POSTGRES_PASSWORD: mimnets
          POSTGRES_DB: mimnets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimnets -d mimnets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mail:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]

      storage:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: mimnets
          MINIO_ROOT_PASSWORD: mimnets-secret
        ports: ["9000:9000"]

    env:
      DATABASE_URL: postgres://mimnets:mimnets@localhost:5432/mimnets
      AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      BASE_URL: http://localhost:3000
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: mimnets
      S3_TEST_SECRET_KEY: mimnets-secret
      SMTP_TEST_API: http://localhost:8025
      SMTP_TEST_HOST: localhost
      SMTP_TEST_PORT: "1025"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - run: pnpm typecheck

      - run: pnpm test

      # The build must stay warning-free: storage.ts carries a turbopackIgnore that stops the
      # bundler tracing the whole project into the deploy, and it warns loudly if removed.
      - run: pnpm build
