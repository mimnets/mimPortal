# Two ways to use this file:
#
#   docker compose up -d db          → Postgres only, for local development (pnpm dev on the host)
#   docker compose --profile full up → the whole Site, app and database, self-hosted
#
# The second form is what runs on a VPS (ADR-0008). The first is the everyday dev database.

# Each Site on a shared host needs its own project name, so this is overridable:
#   COMPOSE_PROJECT_NAME=client-a docker compose up -d db
name: ${COMPOSE_PROJECT_NAME:-mimnets-multisite}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mimnets
      POSTGRES_PASSWORD: mimnets
      POSTGRES_DB: mimnets
    ports:
      - "5432:5432"
    volumes:
      - mimnets-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimnets -d mimnets"]
      interval: 5s
      timeout: 5s
      retries: 10

  # An S3-compatible bucket on the machine, so the S3 adapter is tested against a real
  # server that verifies real signatures rather than against a mock of one:
  #   docker compose --profile storage up -d storage
  storage:
    profiles: ["storage"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: mimnets
      MINIO_ROOT_PASSWORD: mimnets-secret
    ports:
      - "9000:9000"
    volumes:
      - mimnets-storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A real SMTP server that accepts everything and delivers nothing, so the EmailAdapter is
  # tested against a mail server rather than against a mock of one. Its inbox is at
  # http://localhost:8025 — useful for eyeballing what a client will actually receive:
  #   docker compose --profile mail up -d mail
  mail:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # inbox and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mimnets:mimnets@db:5432/mimnets
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # A private npm registry, for proving the packaging story without publishing to the world.
  #
  # M8 asks whether upgrading two Sites from one fix is painful, and the only honest way to
  # find out is a real publish, real version resolution and a real install. Doing that against
  # npm proper means a public, effectively permanent release of every experiment — npm
  # restricts unpublishing and the name is mirrored within minutes. This answers the same
  # question and can be thrown away.
  #
  #   docker compose --profile registry up -d registry
  #   npm --registry http://localhost:4873 adduser     # any username; it is local
  registry:
    profiles: ["registry"]
    image: verdaccio/verdaccio:6
    restart: unless-stopped
    ports:
      - "4873:4873"
    volumes:
      - mimnets-registry:/verdaccio/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4873/-/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mimnets-db:
  mimnets-storage:
  mimnets-registry:
